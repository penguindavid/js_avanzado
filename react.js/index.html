<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>React 100% Local Sin Bloqueos</title>
</head>
<body>

  <div id="root"></div>

  <script>
    // --- 1. MINI EMULACIÓN LOCAL DE REACT Y DOM ---
    // Esto reemplaza las librerías externas para evitar el bloqueo CORS del navegador
    const React = {
      _estado: null,
      _listener: null,
      useState(valorInicial) {
        if (this._estado === null) this._estado = valorInicial;
        const setEstado = (nuevoValor) => {
          this._estado = nuevoValor;
          if (this._listener) this._listener();
        };
        return [this._estado, setEstado];
      },
      createElement(tipo, props, ...hijos) {
        return { tipo, props: props || {}, hijos };
      }
    };

    const ReactDOM = {
      createRoot(contenedor) {
        return {
          render(elementoComponente) {
            const renderizar = () => {
              contenedor.innerHTML = '';
              const nodo = elementoComponente();
              
              function construirDOM(obj) {
                if (typeof obj !== 'object') return document.createTextNode(obj);
                const el = document.createElement(obj.tipo);
                
                // Aplicar propiedades y eventos
                Object.keys(obj.props).forEach(clave => {
                  if (clave.startsWith('on')) {
                    el.addEventListener(clave.substring(2).toLowerCase(), obj.props[clave]);
                  } else if (clave === 'style') {
                    Object.assign(el.style, obj.props[clave]);
                  } else {
                    el[clave] = obj.props[clave];
                  }
                });
                
                // Renderizar hijos recursivamente
                obj.hijos.flat().forEach(hijo => {
                  if (hijo !== null && hijo !== undefined) el.appendChild(construirDOM(hijo));
                });
                return el;
              }
              
              contenedor.appendChild(construirDOM(nodo));
            };
            React._listener = renderizar;
            renderizar();
          }
        };
      }
    };

    // --- 2. TU CÓDIGO REACT DE SIEMPRE ---
    const e = React.createElement;

    function Contador() {
      const [contador, setContador] = React.useState(0);

      return e('div', { style: { fontFamily: 'sans-serif', margin: '20px', padding: '20px', border: '1px solid #ccc', borderRadius: '8px', display: 'inline-block' } },
        e('h2', null, 'Mi primer contador en React'),
        e('p', null, 'Has hecho clic ', e('strong', null, contador), ' veces'),
        e('button', { 
          onClick: () => setContador(contador + 1),
          style: { padding: '8px 16px', cursor: 'pointer', backgroundColor: '#007bff', color: 'white', border: 'none', borderRadius: '4px' }
        }, 'Incrementar')
      );
    }

    // --- 3. MONTAR LA APLICACIÓN ---
    const contenedor = document.getElementById('root');
    const root = ReactDOM.createRoot(contenedor);
    root.render(Contador);
  </script>

</body>
</html>
